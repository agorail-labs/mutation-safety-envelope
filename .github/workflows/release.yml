name: Release (prepared — trusted publishing)

# Release candidate publication is manually dispatched and environment-protected.
#
# Safety properties (audited Nov 5, 2026):
#   * Source: dispatch is accepted ONLY from `main` (reviewed
#     commits); any other ref fails closed before anything runs.
#   * The artifact is packed EXACTLY ONCE, in the verify job. The
#     smoke test installs that same tarball (via
#     AGORAIL_SMOKE_TARBALL) — it never re-packs. The publish job
#     re-verifies the tarball's SHA-256 against the recorded
#     manifest and fails closed on any mismatch or missing file,
#     and inspects the tarball's full file list again.
#   * Dist-tag: the publish step passes `--tag` EXPLICITLY (input
#     `dist_tag`, default `next`). This matters here: the package
#     embeds publishConfig.tag, which governs a bare
#     `npm publish`; this workflow never relies on it, and the
#     publish job captures the exact `latest` value BEFORE
#     publishing and fails loudly unless it is byte-identical
#     AFTER. A prerelease version may never take `latest` here.
#   * Inputs: workflow inputs are NEVER interpolated into shell
#     scripts. They reach steps only through environment
#     variables and are strictly validated (semver and dist-tag
#     formats, then an allowlist: this workflow is restricted to
#     the 1.0.0-rc.2 release candidate under the `next` tag; a
#     future release amends the allowlist in its release commit).
#   * npm CLI: trusted publishing requires npm >= 11.5.1. The
#     Node 22 toolchain's bundled npm is older, so both jobs
#     install npm@11 explicitly and assert the version floor
#     before doing any work.
#   * Authorization: the publish job runs in the protected
#     `npm-release` GitHub Environment (the maintainer configures
#     its required reviewers) and additionally requires the typed
#     PUBLISH confirmation and an exact `expected_version` match
#     against both package/package.json and the tarball itself.
#
# Publishing requires, in order:
#   1. A maintainer decision to cut a release from an identified
#      commit on main (version bump already merged via PR).
#   2. npm trusted-publisher configuration for this repository and
#      workflow on the @agorail-labs/mse-reference package page
#      (npmjs.com → package → Settings → Trusted Publisher).
#   3. The `npm-release` environment configured with required
#      reviewers.
# This workflow is workflow_dispatch-only: it never runs on push,
# tag, or schedule. The publish job uses npm trusted publishing
# (OIDC) — no long-lived npm token exists or is needed. Provenance
# attestations are generated by npm automatically under trusted
# publishing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to confirm a real registry publish"
        required: true
        type: string
      expected_version:
        description: "Exact version to publish (must match package/package.json at this commit and the packed tarball)"
        required: true
        type: string
      dist_tag:
        description: "npm dist-tag for this release (release candidates use: next)"
        required: true
        type: string
        default: next

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-and-pack:
    name: Verify, pack, and record the artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject unauthorized source refs
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$RELEASE_REF" != "refs/heads/main" ]; then
            echo "::error::Releases may only be cut from main (got $RELEASE_REF)."; exit 1
          fi
          echo "Release source: $RELEASE_SHA on main"
      - name: Validate release inputs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if ! printf '%s' "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::expected_version is not a well-formed semver: $EXPECTED_VERSION"; exit 1
          fi
          if ! printf '%s' "$DIST_TAG" | grep -Eq '^[A-Za-z][A-Za-z0-9._-]*$'; then
            echo "::error::dist_tag is not a well-formed npm dist-tag: $DIST_TAG"; exit 1
          fi
          if [ "$EXPECTED_VERSION" != "1.0.0-rc.2" ]; then
            echo "::error::This workflow is restricted to the 1.0.0-rc.2 release candidate (got $EXPECTED_VERSION)"; exit 1
          fi
          if [ "$DIST_TAG" != "next" ]; then
            echo "::error::This workflow is restricted to the next dist-tag for the release candidate (got $DIST_TAG)"; exit 1
          fi
          echo "Release inputs validated: $EXPECTED_VERSION under tag $DIST_TAG"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use a verified npm CLI with trusted-publishing support
        run: |
          npm install -g npm@11
          node -e "const v=require('child_process').execSync('npm --version').toString().trim(); const [a,b,c]=v.split('.').map(Number); if (!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) { console.error('npm >= 11.5.1 required for trusted publishing, got '+v); process.exit(1); } console.log('npm CLI verified: '+v);"
      - name: Assert the expected version and tag policy
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          PKG_VERSION=$(node -pe "require('./package/package.json').version")
          if [ "$PKG_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::package/package.json version $PKG_VERSION does not match expected_version $EXPECTED_VERSION"; exit 1
          fi
          case "$PKG_VERSION" in
            *-*) if [ "$DIST_TAG" = "latest" ]; then
                   echo "::error::A prerelease version ($PKG_VERSION) must not be published to latest from this workflow"; exit 1
                 fi ;;
          esac
          echo "Version asserted: $PKG_VERSION (dist-tag: $DIST_TAG)"
      - run: npm ci
      - run: npm test && npm run build && npm run validate-schema
      - name: Pack the exact artifact once and record its SHA-256
        working-directory: package
        run: |
          mkdir -p ../audited
          npm pack --json --pack-destination ../audited > ../audited/pack.json
          cd ../audited
          COUNT=$(ls -1 *.tgz | wc -l)
          if [ "$COUNT" != "1" ]; then echo "::error::Expected exactly one tarball, found $COUNT"; exit 1; fi
          sha256sum *.tgz | tee release-manifest.sha256
          tar -tzf *.tgz | tee release-files.txt
          if grep -E '(^package/(test|examples|docs|spec|node_modules|scripts)/|(^|/)\.env$|(^|/)\.npmrc$|\.pem$)' release-files.txt; then
            echo "::error::Disallowed file in release tarball"; exit 1
          fi
      - name: Install and test the exact tarball in a clean external consumer
        working-directory: package
        run: |
          export AGORAIL_SMOKE_TARBALL=$(ls "$GITHUB_WORKSPACE"/audited/*.tgz)
          npm run smoke:pack
          cd ../audited && sha256sum -c release-manifest.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: audited/
          if-no-files-found: error

  publish:
    name: Publish via npm trusted publishing (OIDC)
    needs: verify-and-pack
    if: inputs.confirm == 'PUBLISH' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use a verified npm CLI with trusted-publishing support
        run: |
          npm install -g npm@11
          node -e "const v=require('child_process').execSync('npm --version').toString().trim(); const [a,b,c]=v.split('.').map(Number); if (!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) { console.error('npm >= 11.5.1 required for trusted publishing, got '+v); process.exit(1); } console.log('npm CLI verified: '+v);"
      - name: Validate release inputs
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if ! printf '%s' "$EXPECTED_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::expected_version is not a well-formed semver: $EXPECTED_VERSION"; exit 1
          fi
          if ! printf '%s' "$DIST_TAG" | grep -Eq '^[A-Za-z][A-Za-z0-9._-]*$'; then
            echo "::error::dist_tag is not a well-formed npm dist-tag: $DIST_TAG"; exit 1
          fi
          if [ "$EXPECTED_VERSION" != "1.0.0-rc.2" ]; then
            echo "::error::This workflow is restricted to the 1.0.0-rc.2 release candidate (got $EXPECTED_VERSION)"; exit 1
          fi
          if [ "$DIST_TAG" != "next" ]; then
            echo "::error::This workflow is restricted to the next dist-tag for the release candidate (got $DIST_TAG)"; exit 1
          fi
          echo "Release inputs validated: $EXPECTED_VERSION under tag $DIST_TAG"
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
          path: audited
      - name: Verify the exact artifact before publishing (fail closed)
        working-directory: audited
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          COUNT=$(ls -1 *.tgz 2>/dev/null | wc -l)
          if [ "$COUNT" != "1" ]; then echo "::error::Expected exactly one tarball to publish, found $COUNT"; exit 1; fi
          if [ ! -s release-manifest.sha256 ]; then echo "::error::Missing release-manifest.sha256"; exit 1; fi
          sha256sum -c release-manifest.sha256
          TARBALL=$(ls *.tgz)
          TARBALL_VERSION=$(tar -xzOf "$TARBALL" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          if [ "$TARBALL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Tarball version $TARBALL_VERSION does not match expected_version $EXPECTED_VERSION"; exit 1
          fi
          tar -tzf "$TARBALL" > /tmp/publish-files.txt
          if grep -E '(^package/(test|examples|docs|spec|node_modules|scripts)/|(^|/)\.env$|(^|/)\.npmrc$|\.pem$)' /tmp/publish-files.txt; then
            echo "::error::Disallowed file in release tarball"; exit 1
          fi
          npm view @agorail-labs/mse-reference dist-tags.latest > latest-before.txt
          if [ ! -s latest-before.txt ]; then
            echo "::error::Could not capture the current latest dist-tag; refusing to publish without a before-value to compare against"; exit 1
          fi
          echo "Artifact verified: $TARBALL @ $TARBALL_VERSION (latest before: $(cat latest-before.txt))"
      - name: Publish the verified tarball with an explicit dist-tag
        working-directory: audited
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish $(ls *.tgz) --tag "$DIST_TAG" --provenance --access public
      - name: Verify registry dist-tag state after publishing
        working-directory: audited
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          LATEST_BEFORE=$(cat latest-before.txt)
          for attempt in $(seq 1 60); do
            TAGS=$(npm view @agorail-labs/mse-reference dist-tags --json 2>/dev/null || true)
            STATUS=$(node -e '
              const [raw, before, expected, tag] = process.argv.slice(1);
              let tags;
              try { tags = JSON.parse(raw); } catch { console.log("RETRY"); process.exit(0); }
              if (!tags || typeof tags !== "object") { console.log("RETRY"); process.exit(0); }
              if (typeof tags.latest === "string" && tags.latest !== before) {
                console.log("LATEST_CHANGED"); process.exit(0);
              }
              if (tags.latest === before && tags[tag] === expected) {
                console.log("VERIFIED"); process.exit(0);
              }
              console.log("RETRY");
            ' "$TAGS" "$LATEST_BEFORE" "$EXPECTED_VERSION" "$DIST_TAG")
            echo "npm registry attempt $attempt/60: $STATUS"
            case "$STATUS" in
              VERIFIED)
                echo "Registry confirms $DIST_TAG=$EXPECTED_VERSION and latest unchanged at $LATEST_BEFORE"
                exit 0 ;;
              LATEST_CHANGED)
                echo "::error::latest changed during release; manual reconciliation required"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Registry did not confirm next=$EXPECTED_VERSION within 15 minutes. Do NOT rerun publishing; inspect npm version/tag state first."
          exit 1
