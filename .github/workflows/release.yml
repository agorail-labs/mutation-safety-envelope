name: Release (prepared — trusted publishing)

# PREPARED, NOT YET ACTIVATED. Publishing requires, in order:
#   1. A maintainer decision to cut a release from an identified commit.
#   2. npm trusted-publisher configuration for this repository and
#      workflow on the @agorail-labs/mse-reference package page
#      (npmjs.com → package → Settings → Trusted Publisher).
#   3. A version bump commit for package/package.json.
# This workflow is workflow_dispatch-only: it never runs on push,
# tag, or schedule. The publish job uses npm trusted publishing
# (OIDC) — no long-lived npm token exists or is needed. Provenance
# attestations are generated by npm automatically under trusted
# publishing.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUBLISH to confirm a real registry publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: Verify, pack, and record the artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test && npm run build && npm run validate-schema
      - name: Pack the exact artifact and record its SHA-256
        working-directory: package
        run: |
          npm pack
          sha256sum *.tgz | tee release-manifest.txt
          tar -tzf *.tgz | tee -a release-manifest.txt
      - name: Install the exact tarball in a clean external consumer
        run: npm run smoke:pack
        working-directory: package
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifact
          path: |
            package/*.tgz
            package/release-manifest.txt

  publish:
    name: Publish via npm trusted publishing (OIDC)
    needs: verify-and-pack
    if: inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-artifact
      - name: Publish the verified tarball (exact bytes from the verify job)
        run: npm publish *.tgz --provenance --access public
